[package]
name = "frontend"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toasty = { version = "0.11", features = ["sqlite"] }
toasty-cli = "0.11"
tokio = { workspace = true }
topcoat = { version = "0.11.0", default-features = false, features = [
  "asset",
  "discover",
  "font-fontsource",
  "icon-iconify",
  "router",
  "runtime",
  "serve",
  "tailwind",
  "ui",
  "view",
] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = [
  "icon-iconify",
  "tailwind",
] }
