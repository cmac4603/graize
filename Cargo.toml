[workspace]
members = ["controller", "frontend"]
resolver = "3"

[workspace.package]
version = "0.1.4"
authors = ["Colin MacRae <cmac4603@users.noreply.github.com>"]
description = "Self-hosted AI Runner on K8s"
edition = "2024"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "query",
  "rustls",
  "stream",
] }
reqwest-middleware = { version = "0.5", features = ["query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
