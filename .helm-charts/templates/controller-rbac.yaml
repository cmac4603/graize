apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "graize.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graize.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "graize.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graize.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "graize.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graize.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "graize.controllerName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "graize.controllerName" . }}
