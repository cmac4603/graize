apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graize.uiName" . }}
  labels:
    {{- include "graize.uiLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "graize.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "graize.uiSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          args: ["toasty", "migration", "apply"]
          workingDir: /app
          env:
            - name: DATABASE_URL
              value: {{ .Values.ui.databaseUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: {{ .Values.ui.databaseUrl | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
{{- if and .Values.ui.persistence.enabled .Values.ui.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.ui.persistence.existingClaim }}
{{- else if .Values.ui.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "graize.uiDataName" . }}
{{- else }}
          emptyDir: {}
{{- end }}
