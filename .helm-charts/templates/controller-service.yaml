apiVersion: v1
kind: Service
metadata:
  name: {{ include "graize.controllerName" . }}
  labels:
    {{- include "graize.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.controller.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "graize.selectorLabels" . | nindent 4 }}
