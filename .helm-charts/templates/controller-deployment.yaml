apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graize.controllerName" . }}
  labels:
    {{- include "graize.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "graize.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "graize.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          {{- with .Values.controller.workerAuth.existingSecret }}
          env:
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.controller.workerAuth.passwordKey | quote }}
            {{- with $.Values.controller.workerAuth.usernameKey }}
            - name: OPENCODE_SERVER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.controller.workerAuth.existingSecret | quote }}
                  key: {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
