apiVersion: v1
kind: Service
metadata:
  name: {{ include "graize.frontendName" . }}
  labels:
    {{- include "graize.frontendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "graize.frontendSelectorLabels" . | nindent 4 }}
