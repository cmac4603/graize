name: Publish controller image

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          push: true
          tags: |
            ghcr.io/cmac4603/graize/controller:latest
            ghcr.io/cmac4603/graize/controller:${{ github.sha }}
            ghcr.io/cmac4603/graize/controller:${{ github.event.release.tag_name }}
